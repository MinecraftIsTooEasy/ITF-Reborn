import java.text.SimpleDateFormat

plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "[黄昏重生]" + project.archives_base_name
}

def canonical_version = project.mod_version
project.version += ("-mc" + project.minecraft_version + "-" + new SimpleDateFormat("yyyyMMdd").format(new Date()))

repositories {
    maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
}

configurations {
    fml
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

    // these are necessary for running
    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.0"
    implementation "com.github.MinecraftIsTooEasy:RustedIronCore:1.5.0"
    implementation "com.github.MinecraftIsTooEasy:Conditional-Mixin:0.6.4"

    // compile needed, runtime not needed
    compileOnly "com.github.MinecraftIsTooEasy:MITE-ITE:2.0.19"
    compileOnly "com.github.MinecraftIsTooEasy:Baubles:1.1.1"
    compileOnly "com.github.MinecraftIsTooEasy:Shop:1.0.4"
    compileOnly "com.github.MinecraftIsTooEasy:RWG:1.4.2"
    compileOnly "com.github.MinecraftIsTooEasy:Extreme:0.1.6.11"

    // useful mods
    implementation "com.github.MinecraftIsTooEasy:ModernMITE:3.7.1"
    implementation "com.github.MinecraftIsTooEasy:OMMC:1.4.2"
    implementation "com.github.MinecraftIsTooEasy:Neodymium:1.1.1"
    implementation "com.github.MinecraftIsTooEasy:Waila:2.0.4"
    implementation "com.github.MinecraftIsTooEasy:MixinConflictHelper:1.0.0"
    implementation "com.github.MinecraftIsTooEasy:ModMenu:10.1.1"
    implementation "com.github.MinecraftIsTooEasy:PinIn-Lib:1.6.0"
    implementation "com.github.MinecraftIsTooEasy:ExtraGui:1.3.6"

    implementation "com.github.MinecraftIsTooEasy:Gson:2.10.1"
    implementation "com.github.MinecraftIsTooEasy:FastUtil:8.5.12"
    implementation "com.github.MinecraftIsTooEasy:EMI:1.1.24"
}

def fmlResolvedFile = configurations.fml.files.iterator().next()

loom {
    accessWidenerPath = file("src/main/resources/MITEIsTooFalse.accessWidener")
    mergedMinecraftJar()

    mods {
        "MITE-ITF-Reborn" {
            sourceSet sourceSets.main
        }
    }
}

loom.setFML(fmlResolvedFile)
dependencies.add("mappings", loom.fmlMCPMappings())

processResources {
    inputs.property "version", project.version

    filesMatching("fml.mod.json") {
        expand "version": canonical_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
//    options.compilerArgs += ["-Dmod_version=${mod_version}"]
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
}

tasks.named('runClient', JavaExec).configure { exec ->
    def user = project.hasProperty('username') ? project.username : 'Dev'
    exec.setArgs(['--username', user, '--session', '0', '--width', '854', '--height', '480'])
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}