import java.text.SimpleDateFormat

plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

def canonicalVersion = project.mod_version
def buildDate = new SimpleDateFormat("yyyyMMdd").format(new Date())
def archiveVersion = "${canonicalVersion}-mc${project.minecraft_version}-${buildDate}"

version = archiveVersion
group = project.maven_group

def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("CN")

base {
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[黄昏重生]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    mavenCentral()
    mavenLocal()
    // Add repositories to retrieve artifacts from in here.
    // Only declare repositories required by this project because Loom provides
    // the repositories needed for Minecraft and its libraries automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repository declarations.
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = "https://maven.limingzxc.top/repository/maven-public/"
    }
}

configurations {
    fml
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

    // these are necessary for running
    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"
    implementation "org.moddedmite:rusted-iron-core:1.5.7"
    implementation "com.github.MinecraftIsTooEasy:Conditional-Mixin:0.6.4"

    // compile needed, runtime not needed
    compileOnly "com.github.MinecraftIsTooEasy:EMI:1.1.26"
    compileOnly "com.github.MinecraftIsTooEasy:MITE-ITE:2.0.25"
    compileOnly "com.github.MinecraftIsTooEasy:Baubles:1.1.2"
    compileOnly "com.github.MinecraftIsTooEasy:NewShop:1.0.6"
    compileOnly "com.github.MinecraftIsTooEasy:Shop:1.0.5"
    compileOnly "com.github.MinecraftIsTooEasy:RWG:1.4.2"
    compileOnly "com.github.MinecraftIsTooEasy:Extreme:0.1.6.12"
    compileOnly "com.github.MinecraftIsTooEasy:OffHand:3.0.2"
    compileOnly "com.github.MinecraftIsTooEasy:ModMenu:10.1.1"
    compileOnly "org.moddedmite:waila:2.0.8"

    // useful mods
//    localRuntime "org.moddedmite:enchantdivine:1.0.3"
    localRuntime "com.github.MinecraftIsTooEasy:ModernMITE:3.7.5"
    localRuntime "com.github.MinecraftIsTooEasy:OMMC:1.4.2"
    localRuntime "com.github.MinecraftIsTooEasy:Neodymium:1.1.1"
    localRuntime "org.moddedmite:waila:2.0.8"
    localRuntime "com.github.MinecraftIsTooEasy:MixinConflictHelper:1.0.0"
    localRuntime "com.github.MinecraftIsTooEasy:PinIn-Lib:1.6.0"
    localRuntime "com.github.MinecraftIsTooEasy:ExtraGui:1.3.6"
    localRuntime "com.github.MinecraftIsTooEasy:Gson:2.10.1"
    localRuntime "com.github.MinecraftIsTooEasy:FastUtil:8.5.12"
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/MITEIsTooFalse.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())
    mods {
        "mite_itf_reborn" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
//            For modules in the 'src' directory, only the main source set is required by default.
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

processResources {
    inputs.properties(
            version: canonicalVersion,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    // Loom automatically attaches sourcesJar to remapSourcesJar and the build lifecycle when it is present.
    // Remove this line only when source artifacts should not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }
}

// Configure the Maven publication.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            version = canonicalVersion
            from(components.java)
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Publication repositories are separate from dependency repositories declared above.
        // Add or remove release targets here without changing dependency resolution.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
